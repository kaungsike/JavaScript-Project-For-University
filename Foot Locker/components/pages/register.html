<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style/register.css">
</head>
<body>
    <section class="section-1">
        <div class="from-container">
            <header>
                <h2>Create Your Account!</h2>
            </header>
            <form class="register-form" action="">
                <div class="input-container">
                    <label for="name">Name </label>
                    <input id="name" required type="text" placeholder="Enter Your Name">
                </div>
                <div class="input-container">
                    <label for="email">Email </label>
                    <input id="email" required type="email" placeholder="Enter Your Email">
                </div>
                <div class="input-container">
                    <label for="password">Password </label>
                    <input id="password" required type="password" placeholder="Enter Your Password">
                </div>
                <div class="input-container">
                    <label for="conformPassword">Retype Password </label>
                    <input required id="conformPassword" type="password" placeholder="Conform Your Password">
                </div>
                <div>
                    <input required class="check" type="checkbox" id="checkBox"><label for="checkBox">I accepts all terms and conditions</label>
                </div>

                <button type="submit" style="width: 95%;height: 40px;background-color: black;color: white;margin-left: 20px;border: none;margin-top: 20px;">Sign Up</button>
            </form>
        </div>
        <div class="img-container">
            <img style="width: 500px;" src="../undraw_welcome_cats_thqn.svg" alt="">
        </div>
    </section>
</body>
<script type="module" src="../main.js"></script>
</html>
