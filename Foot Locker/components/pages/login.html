<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>
    <section class="section-1">
        <div class="from-container">
            <header>
                <h2>Welcome Back</h2>
            </header>
            <form id="loginForm" class="register-form" action="" method="">
                <div class="input-container">
                    <label for="email">Email </label>
                    <input name="email" id="email" required type="email" placeholder="Enter Your Email">
                </div>
                <div class="input-container">
                    <label for="password">Password </label>
                    <input name="password" id="password" required type="password" placeholder="Enter Your Password">
                </div>
                <div>
                    <input required class="check" type="checkbox" id="checkBox"><label for="checkBox">I accepts all terms and conditions</label>
                </div>
                <div style="width: 100%;text-align: center;margin-top: 30px;">
                    <a href="./register.html" style="text-align: center;font-size: 15px;margin-left: 20px;text-decoration: underline">Register </a>
                </div>
                <button type="submit" style="width: 95%;height: 40px;background-color: black;color: white;margin-left: 20px;border: none;margin-top: 20px;">Login</button>

            </form>
        </div>
        <div class="img-container">
            <img style="width: 500px;" src="./undraw_filter_re_sa16.svg" alt="">
        </div>
    </section>
</body>
<script type="module" src="../main.js"></script>
</html>
